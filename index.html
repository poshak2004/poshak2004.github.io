<!doctype html>
<html lang="en">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1d1530;
    --paper: #fff8ee;
    --chrome: #e9dfd2;
    --chrome-hi: #fffaf2;
    --chrome-lo: #9c8e86;
    --chrome-dk: #3b2f45;

  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d1b4b; color: var(--ink); font-family: var(--font-ui); font-size: 20px; }
  ::selection { background: var(--title-b); color: #fff; }
  #scene { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; image-rendering: crisp-edges; z-index: 0; }

  /* ---------- desktop icons ---------- */
  #desktop { position: fixed; inset: 0 0 44px 0; z-index: 1; padding: 14px; display: grid; grid-auto-flow: column; grid-template-rows: repeat(auto-fill, 96px); grid-auto-columns: 104px; gap: 4px 8px; align-content: start; user-select: none; }
  .icon { width: 104px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 2px; border: 1px dashed transparent; cursor: default; color: #fff; text-align: center; outline: none; background: none; font: inherit; }
  .icon img { width: 48px; height: 48px; image-rendering: pixelated; filter: drop-shadow(2px 2px 0 rgba(20, 10, 40, 0.55)); pointer-events: none; }
  .icon span { font-size: 18px; line-height: 1.05; padding: 1px 3px; text-shadow: 2px 2px 0 #1d1530, 0 0 6px rgba(20, 10, 40, 0.6); overflow-wrap: anywhere; word-break: normal; }
  .icon.selected span, .icon:focus-visible span { background: var(--select); text-shadow: 1px 1px 0 #1d1530; }
  .icon.selected img, .icon:focus-visible img { filter: drop-shadow(2px 2px 0 rgba(20, 10, 40, 0.55)) brightness(0.85) sepia(0.4) hue-rotate(200deg); }
  .icon:focus-visible { border-color: rgba(255, 255, 255, 0.8); }
  #sticky { position: fixed; top: 16px; right: 18px; z-index: 2; width: 230px; padding: 16px 14px 12px; background: #fff3a8; color: #1d1530; transform: rotate(1.5deg); box-shadow: 4px 5px 0 rgba(20, 10, 40, 0.35); display: flex; flex-direction: column; gap: 2px; font-size: 19px; line-height: 1.05; }
  #sticky strong { font-family: var(--font-pixel); font-weight: 400; font-size: 10px; margin-bottom: 6px; }
  #sticky .pin { position: absolute; top: -6px; left: 50%; width: 12px; height: 12px; background: #d1678f; border: 2px solid #1d1530; }
  #sticky .links { display: flex; gap: 6px; margin-top: 8px; }
  #sticky button { font: inherit; font-size: 17px; padding: 1px 8px; background: #fffbe0; color: #1d1530; border: 2px solid #1d1530; cursor: pointer; }
  #sticky button:hover, #sticky button:focus-visible { background: #3b2f7a; color: #fff; outline: none; }
  .hint b { font-weight: 400; color: #ffd29a; }
  .case { margin: 10px 0 4px; border: 2px solid #c9b8ea; background: #fbf7ff; }
  .case div { display: grid; grid-template-columns: 84px 1fr; gap: 10px; padding: 6px 10px; border-top: 1px dashed #d9cfe6; line-height: 1.08; }
  .case div:first-child { border-top: 0; }
  .case dt { font-family: var(--font-pixel); font-size: 8px; color: var(--title-a); padding-top: 4px; }
  .case dd { margin: 0; }
  .hl-title { font-family: var(--font-pixel); font-size: 9px; color: var(--muted); margin: 14px 0 2px; }
  .hint { position: fixed; right: 16px; bottom: 56px; z-index: 1; color: #fff; font-size: 18px; text-shadow: 2px 2px 0 #1d1530; opacity: 0.85; pointer-events: none; text-align: right; }

  /* ---------- windows ---------- */
  .win { position: fixed; z-index: 10; min-width: 280px; min-height: 160px; display: flex; flex-direction: column; background: var(--chrome); border: 2px solid; border-color: var(--chrome-hi) var(--chrome-dk) var(--chrome-dk) var(--chrome-hi); box-shadow: inset -2px -2px 0 var(--chrome-lo), inset 2px 2px 0 #fff, 6px 6px 0 rgba(20, 10, 40, 0.35); padding: 3px; resize: both; overflow: hidden; max-width: 100vw; max-height: calc(100vh - 44px); }
  .win.max { left: 0 !important; top: 0 !important; width: 100vw !important; height: calc(100vh - 44px) !important; resize: none; }
  .win.min { display: none; }
  .win.opening { animation: pop 140ms steps(4) both; }
  @keyframes pop { from { transform: scale(0.85); opacity: 0; } to { transform: none; opacity: 1; } }
  .titlebar { display: flex; align-items: center; gap: 6px; padding: 3px 3px 3px 6px; background: linear-gradient(90deg, var(--title-inactive-a), var(--title-inactive-b)); color: #fff; cursor: grab; user-select: none; touch-action: none; }
  .win.active .titlebar { background: linear-gradient(90deg, var(--title-a), var(--title-b)); }
  .titlebar img { width: 18px; height: 18px; image-rendering: pixelated; }
  .titlebar .t { flex: 1; font-family: var(--font-pixel); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.35); padding-top: 2px; }
  .tbtn { width: 24px; height: 22px; display: grid; place-items: center; background: var(--chrome); color: var(--ink); border: 2px solid; border-color: var(--chrome-hi) var(--chrome-dk) var(--chrome-dk) var(--chrome-hi); font-family: var(--font-pixel); font-size: 9px; padding: 0; cursor: pointer; }
  .tbtn:active, .btn:active { border-color: var(--chrome-dk) var(--chrome-hi) var(--chrome-hi) var(--chrome-dk); }
  .menubar { display: flex; gap: 2px; padding: 2px 2px 3px; font-size: 19px; flex-wrap: wrap; }
  .menubar button { background: none; border: 0; font: inherit; color: var(--ink); padding: 0 8px; cursor: pointer; }
  .menubar button:hover, .menubar button:focus-visible { background: var(--title-a); color: #fff; outline: none; }
  .body { flex: 1; min-height: 0; overflow: auto; background: var(--paper); border: 2px solid; border-color: var(--chrome-dk) var(--chrome-hi) var(--chrome-hi) var(--chrome-dk); }
  .statusbar { display: flex; gap: 4px; padding-top: 3px; font-size: 17px; color: var(--muted); }
  .statusbar > div { flex: 1; padding: 0 6px; border: 2px solid; border-color: var(--chrome-lo) var(--chrome-hi) var(--chrome-hi) var(--chrome-lo); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- window contents ---------- */
  .pad { padding: 14px 16px 18px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; background: var(--chrome); color: var(--ink); border: 2px solid; border-color: var(--chrome-hi) var(--chrome-dk) var(--chrome-dk) var(--chrome-hi); font: inherit; font-size: 19px; text-decoration: none; cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn[aria-disabled="true"] { color: var(--chrome-lo); pointer-events: none; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  h1, h2 { font-family: var(--font-pixel); font-weight: 400; line-height: 1.5; margin: 0 0 8px; }

  h2 { font-size: 11px; margin-top: 18px; color: var(--title-a); }

  ul.hl { margin: 6px 0; padding-left: 20px; }
  ul.hl li { margin: 3px 0; line-height: 1.1; }
  ul.hl li::marker { content: "▸ "; color: var(--title-b); }
  .chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
  .chip { font-size: 17px; padding: 0 7px; background: #efe5ff; border: 1px solid #c9b8ea; color: #3b2f7a; }
  .badge { display: inline-block; font-family: var(--font-pixel); font-size: 8px; padding: 4px 6px 3px; color: #fff; vertical-align: middle; }
  .badge.live { background: var(--ok); } .badge.local { background: var(--muted); } .badge.wip { background: var(--warn); } .badge.plan { background: #8b7f9a; } .badge.dl { background: var(--accent); }
  .note { margin-top: 12px; padding: 8px 10px; background: #fff1d6; border: 1px dashed #d9a75b; font-size: 18px; line-height: 1.1; }
  .tabs { display: flex; gap: 2px; padding: 0 4px; margin-top: 2px; }
  .tab { font: inherit; font-size: 19px; padding: 2px 12px; background: var(--chrome); border: 2px solid; border-bottom: 0; border-color: var(--chrome-hi) var(--chrome-dk) transparent var(--chrome-hi); cursor: pointer; position: relative; top: 2px; color: var(--ink); }
  .tab[aria-selected="true"] { background: var(--paper); z-index: 1; padding-top: 4px; top: 2px; }
  .panel[hidden] { display: none; }
  iframe.live { width: 100%; height: 100%; min-height: 420px; border: 0; display: block; background: #fff; }
  .md { font-family: system-ui, -apple-system, Segoe UI, sans-serif; font-size: 14px; line-height: 1.55; color: #241b2f; }
  .md img { max-width: 100%; }
  .md pre { background: #241b2f; color: #f3e9ff; padding: 10px; overflow: auto; font-size: 12px; }
  .md code { font-size: 12px; background: #efe5ff; padding: 1px 4px; }
  .md pre code { background: none; padding: 0; }
  .md table { border-collapse: collapse; display: block; overflow-x: auto; }
  .md td, .md th { border: 1px solid #d9cfe6; padding: 4px 8px; }
  .md h1, .md h2, .md h3 { font-family: system-ui, sans-serif; font-weight: 700; color: #241b2f; }
  .md h1 { font-size: 22px; } .md h2 { font-size: 18px; margin-top: 20px; } .md h3 { font-size: 15px; }
  .explorer { display: grid; grid-template-columns: repeat(auto-fill, 104px); gap: 8px; padding: 12px; }
  .explorer .icon { color: var(--ink); width: 104px; }
  .explorer .icon span { text-shadow: none; }
  .explorer .icon img { filter: none; }
  .explorer .icon .sub { font-size: 15px; color: var(--muted); background: none; }
  .notepad { font-family: var(--font-ui); font-size: 20px; line-height: 1.1; white-space: pre-wrap; padding: 10px 14px; margin: 0; color: #1d1530; }
  .notepad a { color: #3b2f7a; }

  /* ---------- taskbar / start ---------- */
  #taskbar { position: fixed; left: 0; right: 0; bottom: 0; height: 44px; z-index: 1000; display: flex; align-items: center; gap: 6px; padding: 4px 6px; background: var(--taskbar); border-top: 2px solid rgba(255, 255, 255, 0.35); backdrop-filter: blur(3px); }
  #start { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px 0 6px; font-family: var(--font-pixel); font-size: 11px; color: var(--ink); background: var(--chrome); border: 2px solid; border-color: var(--chrome-hi) var(--chrome-dk) var(--chrome-dk) var(--chrome-hi); cursor: pointer; }
  #start[aria-expanded="true"] { border-color: var(--chrome-dk) var(--chrome-hi) var(--chrome-hi) var(--chrome-dk); }
  #start img { width: 22px; height: 22px; image-rendering: pixelated; }
  #tasks { flex: 1; display: flex; gap: 4px; overflow-x: auto; min-width: 0; }
  .task { display: flex; align-items: center; gap: 6px; height: 34px; max-width: 190px; min-width: 44px; padding: 0 8px; font: inherit; font-size: 18px; color: var(--ink); background: var(--chrome); border: 2px solid; border-color: var(--chrome-hi) var(--chrome-dk) var(--chrome-dk) var(--chrome-hi); cursor: pointer; white-space: nowrap; overflow: hidden; }
  .task.active { background: #fffaf2; border-color: var(--chrome-dk) var(--chrome-hi) var(--chrome-hi) var(--chrome-dk); }
  .task img { width: 18px; height: 18px; image-rendering: pixelated; flex: none; }
  .task span { overflow: hidden; text-overflow: ellipsis; }
  #tray { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; color: #fff; font-size: 20px; border: 2px solid; border-color: rgba(0, 0, 0, 0.35) rgba(255, 255, 255, 0.35) rgba(255, 255, 255, 0.35) rgba(0, 0, 0, 0.35); }
  #tray button { background: none; border: 0; padding: 0; cursor: pointer; line-height: 0; }
  #tray img { width: 20px; height: 20px; image-rendering: pixelated; }
  #startmenu { position: fixed; left: 6px; bottom: 46px; z-index: 1001; width: 290px; display: flex; background: var(--chrome); border: 2px solid; border-color: var(--chrome-hi) var(--chrome-dk) var(--chrome-dk) var(--chrome-hi); box-shadow: 6px 6px 0 rgba(20, 10, 40, 0.35); }
  #startmenu[hidden] { display: none; }
  #startmenu .side { width: 34px; background: linear-gradient(0deg, var(--title-a), var(--title-b)); color: #fff; writing-mode: vertical-rl; transform: rotate(180deg); font-family: var(--font-pixel); font-size: 11px; padding: 10px 8px; letter-spacing: 1px; }
  #startmenu ul { list-style: none; margin: 0; padding: 4px; flex: 1; }
  #startmenu li button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 5px 8px; background: none; border: 0; font: inherit; font-size: 20px; color: var(--ink); text-align: left; cursor: pointer; }
  #startmenu li button:hover, #startmenu li button:focus-visible { background: var(--title-a); color: #fff; outline: none; }
  #startmenu li img { width: 24px; height: 24px; image-rendering: pixelated; }
  #startmenu hr { border: 0; border-top: 2px groove var(--chrome-hi); margin: 4px 2px; }

  /* ---------- pet ---------- */
  #pet { position: fixed; left: 0; top: 0; z-index: 6; width: 66px; height: 54px; image-rendering: pixelated; cursor: pointer; touch-action: none; }
  .bubble { position: fixed; z-index: 7; pointer-events: none; font-family: var(--font-pixel); font-size: 10px; color: #fff; text-shadow: 2px 2px 0 #1d1530; animation: floatup 1.4s steps(10) forwards; }
  .bubble.heart { color: #ff6b8b; font-size: 14px; }
  @keyframes floatup { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-46px); opacity: 0; } }
  #yarn { position: fixed; z-index: 5; width: 24px; height: 24px; image-rendering: pixelated; cursor: grab; touch-action: none; }
  #yarn[hidden] { display: none; }

  /* ---------- boot / shutdown ---------- */
  #boot, #off { position: fixed; inset: 0; z-index: 5000; display: grid; place-items: center; text-align: center; background: #120c22; color: #ffd29a; font-family: var(--font-pixel); font-size: 12px; line-height: 2; }
  #boot[hidden], #off[hidden] { display: none; }
  #boot .bar { width: 220px; height: 14px; margin: 18px auto 0; border: 2px solid #ffd29a; padding: 2px; }
  #boot .bar i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(90deg, #f28482 0 10px, transparent 10px 14px); animation: load 1.1s steps(14) forwards; }
  @keyframes load { to { width: 100%; } }
  #off { background: #000; color: #ffb35c; cursor: pointer; }

  /* ---------- toasts ---------- */
  #toasts { position: fixed; right: 10px; bottom: 54px; z-index: 1002; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; pointer-events: none; }
  .toast { pointer-events: auto; max-width: 330px; display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; background: #fffbe8; border: 2px solid; border-color: var(--chrome-hi) var(--chrome-dk) var(--chrome-dk) var(--chrome-hi); box-shadow: 4px 4px 0 rgba(20, 10, 40, 0.35); font-size: 18px; line-height: 1.05; animation: toastIn 220ms steps(5) both; }
  .toast img { width: 22px; height: 22px; image-rendering: pixelated; flex: none; }
  .toast b { font-family: var(--font-pixel); font-size: 8px; display: block; margin-bottom: 4px; color: var(--title-a); }
  .toast.out { animation: toastOut 200ms steps(4) forwards; }
  @keyframes toastIn { from { transform: translateX(120%); } to { transform: none; } }
  @keyframes toastOut { to { transform: translateX(120%); opacity: 0; } }

  /* ---------- impact counters ---------- */
  .stat-row { display: grid; grid-template-columns: 170px 1fr 70px; gap: 10px; align-items: center; margin: 8px 0; }
  .stat-row .lbl { font-size: 19px; }
  .stat-row .num { text-align: right; font-family: var(--font-pixel); font-size: 11px; }
  .pbar { height: 18px; border: 2px solid; border-color: var(--chrome-dk) var(--chrome-hi) var(--chrome-hi) var(--chrome-dk); background: #f1e8dc; padding: 2px; }
  .pbar i { display: block; height: 100%; width: 0; transition: width 1.4s steps(28); background: repeating-linear-gradient(90deg, var(--c, var(--accent)) 0 10px, transparent 10px 12px); }
  .bignum { font-family: var(--font-pixel); font-size: 26px; color: var(--title-a); letter-spacing: 1px; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
  .kpi { background: #efe5ff; border: 1px solid #c9b8ea; padding: 8px; text-align: center; }
  .kpi .bignum { font-size: 16px; display: block; margin-bottom: 4px; }

  /* ---------- mandate demo (plain-language) ---------- */
  .rules { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; padding: 10px 12px; background: #fff3a8; border: 2px solid #1d1530; margin-bottom: 12px; }
  .rules .who { font-family: var(--font-pixel); font-size: 9px; line-height: 1.6; }
  .rules ul { margin: 0; padding-left: 18px; } .rules li { margin: 1px 0; }
  .vs-head, .vs-row { display: grid; grid-template-columns: 1.15fr 1fr 1fr; gap: 8px; }
  .vs-head { font-family: var(--font-pixel); font-size: 8px; color: var(--muted); padding: 0 4px 6px; }
  .vs-head .bad { color: #c0392b; } .vs-head .good { color: var(--ok); }
  .vs-row { margin-bottom: 8px; animation: pop 160ms steps(4) both; }
  .vs-row > div { padding: 8px 10px; line-height: 1.08; border: 2px solid; }
  .vs-ask { background: #fff; border-color: #d9cfe6 !important; }
  .vs-ask small { display: block; color: var(--muted); font-size: 17px; margin-bottom: 3px; }
  .vs-bad { background: #fdecea; border-color: #f0b8b0 !important; color: #8a1c1c; }
  .vs-bad.ok { background: #f1ece6; border-color: #d9cfc4 !important; color: var(--ink); }
  .vs-good { border-color: transparent !important; }
  .vs-good.block { background: #fdecea; } .vs-good.allow { background: #e8f6ee; } .vs-good.ask { background: #fff1d6; }
  .verdict { display: inline-block; font-family: var(--font-pixel); font-size: 9px; padding: 5px 6px 4px; color: #fff; margin-bottom: 5px; animation: stamp 260ms steps(4) both; }
  .verdict.block { background: #c0392b; } .verdict.allow { background: var(--ok); } .verdict.ask { background: var(--warn); } .verdict.oops { background: #8a1c1c; } .verdict.fine { background: #6d6070; }
  @keyframes stamp { from { transform: scale(2.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .vs-hidden { visibility: hidden; }
  .score { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .score > div { padding: 10px; text-align: center; border: 2px solid #1d1530; animation: pop 160ms steps(4) both; }
  .score .bignum { font-size: 20px; display: block; margin-bottom: 4px; }
  .score .bad { background: #fdecea; } .score .bad .bignum { color: #c0392b; } .score .good { background: #e8f6ee; } .score .good .bignum { color: var(--ok); }
  details.tech { margin-top: 12px; font-size: 18px; } details.tech summary { cursor: pointer; color: var(--title-a); }
  @media (max-width: 700px) { .vs-head { display: none; } .vs-row { grid-template-columns: 1fr; gap: 3px; } .vs-bad::before { content: "Without Mandate: "; font-weight: 700; } .vs-good::before { content: "With Mandate: "; font-weight: 700; } .rules { grid-template-columns: 1fr; } }
  .icon.new::after { content: "NEW"; position: absolute; margin: -6px 0 0 34px; font-family: var(--font-pixel); font-size: 7px; background: var(--title-b); color: #fff; padding: 3px 4px 2px; animation: blink 1.2s steps(1) infinite; }
  .icon { position: relative; }
  .icon:hover img { transform: translateY(-3px); }

  @media (max-width: 700px) {
    .stat-row { grid-template-columns: 110px 1fr 56px; }
    #desktop { grid-auto-flow: row; grid-template-columns: repeat(auto-fill, 86px); grid-template-rows: none; grid-auto-columns: auto; justify-content: center; }
    .icon { width: 86px; }
    .win { left: 0 !important; top: 0 !important; width: 100vw !important; height: calc(100vh - 44px) !important; resize: none; }
    .hint { display: none; }
    #sticky { top: 410px; right: 12px; width: 210px; font-size: 17px; }
    .case div { grid-template-columns: 1fr; gap: 2px; }
    .task { max-width: 120px; }
    #pet { width: 54px; height: 44px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .win.opening, .bubble, .toast, .stamp, .prop, .chain .blk, .icon.new::after { animation: none; }
    .pbar i { transition: none; }
  }
  @media print {
    body * { visibility: hidden !important; }
    #print-resume, #print-resume * { visibility: visible !important; }
    #print-resume { position: absolute; inset: 0; display: block !important; background: #fff; color: #000; font-family: Georgia, serif; font-size: 12pt; white-space: pre-wrap; padding: 0; }
    html, body { overflow: visible; height: auto; }
  }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>

<main id="desktop" aria-label="Desktop"></main>
<div class="hint"><b>Start here → Mandate Demo</b><br>double-click an icon to open · click the pet</div>
<aside id="sticky" aria-label="About this site">
  <div class="pin" aria-hidden="true"></div>
  <strong>Poshak Kotresha</strong>

/* ======================================================================
   PIXEL SPRITES — drawn from character maps; outlines added automatically
   ====================================================================== */
function sprite(rows, pal, { outline = "#1d1530", scale = 1 } = {}) {
  const h = rows.length, w = rows[0].length;
  const c = document.createElement("canvas");
  c.width = (w + 2) * scale; c.height = (h + 2) * scale;
  const g = c.getContext("2d");
  const filled = (x, y) => y >= 0 && y < h && x >= 0 && x < w && rows[y][x] !== ".";
  for (let y = -1; y <= h; y++) for (let x = -1; x <= w; x++) {
    let col = null;
    if (filled(x, y)) col = pal[rows[y][x]];
    else if (outline && (filled(x - 1, y) || filled(x + 1, y) || filled(x, y - 1) || filled(x, y + 1))) col = outline;
    if (col) { g.fillStyle = col; g.fillRect((x + 1) * scale, (y + 1) * scale, scale, scale); }
  }
  return c.toDataURL();
}

async function loadReadme(repo) {
  const res = await fetch(`https://api.github.com/repos/poshak2004/${repo}/readme`, { headers: { Accept: "application/vnd.github.raw" } });
  if (!res.ok) throw new Error(res.status);
  const md = await res.text();
  const raw = `https://raw.githubusercontent.com/poshak2004/${repo}/HEAD/`;
  const tmp = document.createElement("div");
  tmp.innerHTML = window.DOMPurify ? DOMPurify.sanitize(marked.parse(md)) : "";
  tmp.querySelectorAll("img[src]").forEach((i) => { const s = i.getAttribute("src"); if (!/^(https?:|data:)/.test(s)) i.src = raw + s.replace(/^\.?\//, ""); });
  tmp.querySelectorAll("a[href]").forEach((a) => { const h = a.getAttribute("href"); if (!/^(https?:|mailto:|#)/.test(h)) a.href = `${GH}/${repo}/blob/HEAD/${h.replace(/^\.?\//, "")}`; a.target = "_blank"; a.rel = "noopener"; });

async function typeInto(node, text, speed = 22) {
  const tok = (node._tok = (node._tok || 0) + 1);
  node.classList.add("typed"); node.classList.remove("done");
  if (reduceMotion) { node.textContent = text; node.classList.add("done"); return; }

/* ======================================================================
   PET — procedurally drawn pixel cat/dog that follows the cursor
   ====================================================================== */
const petEl = document.getElementById("pet"), pg = petEl.getContext("2d");
const yarnEl = document.getElementById("yarn"), yg = yarnEl.getContext("2d");
const PET_STYLES = {
  cat: { fur: "#f4a259", dark: "#c9733a", light: "#ffe8cc", line: "#2b1d2e", accent: "#ff8fa3" },
  dog: { fur: "#c08552", dark: "#7a4e2d", light: "#f6e3c6", line: "#2b1d2e", accent: "#5c3a22" },
};
let petKind = "cat";
try { petKind = localStorage.getItem("pet") === "dog" ? "dog" : "cat"; } catch (e) {}
function drawPet(kind, pose, step) {
  const Wd = 22, Hd = 18, S = PET_STYLES[kind];
  const grid = Array.from({ length: Hd }, () => Array(Wd).fill(null));
  const set = (x, y, c) => { x = Math.round(x); y = Math.round(y); if (x >= 0 && x < Wd && y >= 0 && y < Hd) grid[y][x] = c; };
  const ell = (cx, cy, rx, ry, c) => { for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) if (((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 <= 1) set(x, y, c); };
  let head;
  if (pose === "sleep") {
    ell(10, 13.5, 7, 2.6, S.fur); head = [16, 12.5];
    ell(head[0], head[1], 3.2, 2.8, S.fur);
    for (let x = 3; x <= 8; x++) set(x, 16, S.dark);
  } else if (pose === "sit") {
    ell(10, 12, 4.4, 3.8, S.fur); head = [13.5, 6];
    ell(head[0], head[1], 3.6, 3.2, S.fur);
    set(11, 16, S.light); set(12, 16, S.light); set(14, 16, S.light); set(15, 16, S.light);
    for (let x = 4; x <= 8; x++) set(x, 16, S.dark);
    set(4, 15, S.dark);
  } else {
    ell(9.5, 10.5, 6.6, 3.2, S.fur); head = [16, 6.6];
    ell(head[0], head[1], 3.6, 3.2, S.fur);
    const legs = step % 2 ? [4, 7, 11, 14] : [5, 8, 12, 13];
    legs.forEach((lx, i) => { for (let y = 13; y <= 15; y++) set(lx + (i % 2 ? 0 : 0), y, y === 15 ? S.light : S.fur); });
  }
  const [hx, hy] = head;
  // stripes / patches and chest
  if (kind === "cat" && pose !== "sleep") { set(hx - 7, hy + 3, S.dark); set(hx - 7, hy + 4, S.dark); set(hx - 4, hy + 3, S.dark); set(hx - 4, hy + 4, S.dark); }
  if (kind === "dog" && pose !== "sleep") { ell(hx - 6, hy + 4, 1.6, 1.2, S.light); }
  set(hx - 1, hy + 3, S.light); set(hx, hy + 3, S.light);
  // ears
  if (kind === "cat") {
    for (let i = 0; i < 3; i++) for (let x = 0; x <= i; x++) { set(hx - 3 + x, hy - 4 + i, S.fur); set(hx + 2 - x + 0, hy - 4 + i, S.fur); }
    set(hx - 3, hy - 2, S.accent); set(hx + 2, hy - 2, S.accent);
  } else {
    for (let y = -2; y <= 2; y++) { set(hx - 3, hy + y, S.accent); set(hx - 4, hy + y + 1, S.accent); }
    set(hx + 3, hy + 1, S.light); set(hx + 4, hy + 1, S.light); set(hx + 4, hy + 2, S.light); set(hx + 5, hy + 1, S.line);
  }
  // tail
  const tailCat = step % 2 ? [[2, 9], [1, 8], [1, 7], [0, 6], [0, 5], [1, 4]] : [[2, 9], [1, 8], [0, 7], [0, 6], [1, 5], [2, 4]];
  const tailDog = step % 2 ? [[3, 8], [2, 7], [2, 6], [1, 5]] : [[3, 8], [3, 7], [3, 6], [4, 5]];
  if (pose === "walk") (kind === "cat" ? tailCat : tailDog).forEach(([x, y]) => set(x, y, kind === "cat" ? S.dark : S.fur));
  if (pose === "sit") (kind === "cat" ? [[5, 13], [4, 14]] : [[5, 11], [4, 10], [4, 9]]).forEach(([x, y]) => set(x, y, S.fur));
  // outline
  const out = grid.map((r) => r.slice());
  for (let y = 0; y < Hd; y++) for (let x = 0; x < Wd; x++) if (!grid[y][x]) {
    const n = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => grid[y + dy]?.[x + dx]);
    if (n) out[y][x] = S.line;
  }
  // face
  const eyeY = Math.round(hy - (pose === "sleep" ? 0 : 0.5));
  if (pose === "sleep" || pose === "happy") { out[eyeY][Math.round(hx - 1)] = S.line; out[eyeY][Math.round(hx + 1)] = S.line; out[eyeY][Math.round(hx + 2)] = S.line; out[eyeY][Math.round(hx - 2)] = S.line; }
  else { out[eyeY][Math.round(hx - 1)] = S.line; out[eyeY][Math.round(hx + 2)] = S.line; }
  if (kind === "cat") out[Math.round(hy + 1)][Math.round(hx + 1)] = S.accent;
  pg.clearRect(0, 0, Wd, Hd);
  out.forEach((row, y) => row.forEach((c, x) => { if (c) { pg.fillStyle = c; pg.fillRect(x, y, 1, 1); } }));
}
function drawYarn() {
  yg.clearRect(0, 0, 8, 8);
  const m = ["..pppp..", ".pPppPp.", "pppPPppp", "pPppppPp", "ppPPpppp", "pppppPpp", ".pPpppp.", "..pppp.."];
  m.forEach((r, y) => [...r].forEach((ch, x) => { if (ch !== ".") { yg.fillStyle = ch === "P" ? "#b23a6b" : "#ff6b9a"; yg.fillRect(x, y, 1, 1); } }));
}

const mouse = { x: innerWidth * 0.55, y: innerHeight * 0.6, moved: 0 };
const yarn = { active: false, x: 0, y: 0, vx: 0, vy: 0 };
addEventListener("pointermove", (e) => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.moved = performance.now(); });
function bubble(x, y, text, cls = "") { const b = el("div", { class: "bubble " + cls, style: `left:${x}px;top:${y}px` }, text); document.body.append(b); setTimeout(() => b.remove(), 1400); }
let pets = 0;
petEl.addEventListener("click", (e) => {
  e.stopPropagation();
  pet.happy = 70; pet.idle = 0; pets++;
  for (let i = 0; i < 3; i++) setTimeout(() => bubble(pet.x - 10 + Math.random() * 30, pet.y - 50, "♥", "heart"), i * 120);
  bubble(pet.x - 10, pet.y - 70, petKind === "cat" ? (pets % 5 ? "prrr" : "meow!") : (pets % 5 ? "wag wag" : "woof!"));
});
function throwYarn(x, y) {
  yarn.active = true; yarnEl.hidden = false;
  yarn.x = x ?? Math.random() * (innerWidth - 80) + 40; yarn.y = y ?? innerHeight * 0.4;
  yarn.vx = (Math.random() - 0.5) * 14; yarn.vy = -6 - Math.random() * 4;
}
function swapPet() { petKind = petKind === "cat" ? "dog" : "cat"; try { localStorage.setItem("pet", petKind); } catch (e) {} bubble(pet.x, pet.y - 60, petKind === "cat" ? "meow" : "woof"); updateTrayPet(); }
function updateTrayPet() { document.getElementById("tray-pet-img").src = sprite(ICON_MAPS.cat, { ...P, k: "#1d1530", o: PET_STYLES[petKind].fur }, { scale: 3, outline: null }); }
document.getElementById("tray-pet").addEventListener("click", () => { pet.hidden = !pet.hidden; });
document.getElementById("desktop").addEventListener("dblclick", (e) => { if (e.target.id === "desktop") throwYarn(e.clientX, e.clientY); });
// kick the yarn by clicking it
yarnEl.addEventListener("pointerdown", (e) => { e.stopPropagation(); yarn.vx = (yarn.x - pet.x > 0 ? 1 : -1) * (8 + Math.random() * 6); yarn.vy = -9; });
let petLast = 0;
function petLoop(t) {
  if (document.hidden) { petLast = t; return requestAnimationFrame(petLoop); }
  const dt = Math.min(50, t - petLast || 16) / 16.67; petLast = t;
  const floor = innerHeight - 44 - 6;
  if (yarn.active) {
    yarn.vy += 0.6 * dt; yarn.x += yarn.vx * dt; yarn.y += yarn.vy * dt;
    if (yarn.y > floor - 12) { yarn.y = floor - 12; yarn.vy *= -0.45; yarn.vx *= 0.9; }
    if (yarn.y < sandTopPx() - 200 && yarn.vy < 0) yarn.vy = 0;
    if (yarn.x < 12 || yarn.x > innerWidth - 12) { yarn.vx *= -0.8; yarn.x = Math.max(12, Math.min(innerWidth - 12, yarn.x)); }
    yarn.vx *= 0.995;
    yarnEl.style.transform = `translate(${yarn.x - 12}px, ${yarn.y - 12}px) rotate(${(yarn.x * 6) % 360}deg)`;
  }
  const fullscreenWin = innerWidth <= 700 && [...wins.values()].some((w) => !w.el.classList.contains("min"));
  petEl.style.visibility = fullscreenWin || pet.hidden ? "hidden" : "visible";
  // The pet lives on the dry sand: x follows the cursor, y is clamped between the shoreline and
  // the taskbar, so it never wanders into the sea or across the sky.
  const sandTop = sandTopPx() + petEl.offsetHeight * 0.85;
  const clampY = (y) => Math.max(sandTop, Math.min(floor, y));
  const tx = Math.max(petEl.offsetWidth / 2, Math.min(innerWidth - petEl.offsetWidth / 2, yarn.active ? yarn.x : mouse.x));
  const target = { x: tx, y: clampY(yarn.active ? yarn.y + 14 : mouse.y + 30) };
  const dx = target.x - pet.x, dy = target.y - pet.y, dist = Math.hypot(dx, dy);
  const stopAt = yarn.active ? 14 : 40;
  if (pet.happy > 0) { pet.happy -= dt; pet.pose = "happy"; }
  else if (dist > stopAt) {
    const sp = (yarn.active ? 4.6 : 3.4) * dt * Math.min(1, dist / 120 + 0.35);
    pet.x += (dx / dist) * sp; pet.y += (dy / dist) * sp;
    if (Math.abs(dx) > 2) pet.face = dx > 0 ? 1 : -1;
    pet.pose = "walk"; pet.idle = 0;
  } else {
    if (yarn.active) { yarn.active = false; yarnEl.hidden = true; pet.happy = 60; bubble(pet.x, pet.y - 60, "got it!"); for (let i = 0; i < 3; i++) setTimeout(() => bubble(pet.x - 10 + Math.random() * 30, pet.y - 50, "♥", "heart"), i * 120); }
    pet.idle += dt;
    pet.pose = pet.idle > 480 ? "sleep" : "sit";
    if (pet.pose === "sleep" && Math.random() < 0.012) bubble(pet.x + 16, pet.y - 50, "z");
  }
  pet.y = clampY(pet.y);
  pet.step = Math.floor(t / 140);
  drawPet(petKind, pet.pose === "happy" ? "sit" : pet.pose, pet.step);
  if (pet.pose === "happy") { // closed happy eyes
    const S = PET_STYLES[petKind]; pg.fillStyle = S.line; pg.fillRect(12, 5, 2, 1); pg.fillRect(15, 5, 2, 1);
  }
  const wpx = petEl.offsetWidth, hpx = petEl.offsetHeight;
  petEl.style.transform = `translate(${pet.x - wpx / 2}px, ${pet.y - hpx}px) scaleX(${pet.face})`;
  requestAnimationFrame(petLoop);
}

/* ======================================================================
   BOOT
   ====================================================================== */
function boot() {
  const b = document.getElementById("boot");
  b.hidden = false;
  setTimeout(() => { b.hidden = true; }, reduceMotion ? 200 : 1300);
}
initScene();
buildDesktop();
buildStart();
drawYarn();
updateTrayPet();
tickClock(); setInterval(tickClock, 15000);
requestAnimationFrame(petLoop);
boot();
</script>
</body>
</html>
